name: Deploy to Render

on:
  push:
    branches:
      - main
    # Only trigger on push if changes are made to the server folder
    paths:
      - 'gait_physiotherapy_demo/server/**'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Render Deployment
    runs-on: ubuntu-latest
    
    steps:
      - name: Call Render Deploy Hook
        # Uses the deploy hook URL you get from your Render web service settings
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Error: Please add RENDER_DEPLOY_HOOK_URL to your GitHub repository secrets."
            exit 1
          fi
          echo "Triggering deployment..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
